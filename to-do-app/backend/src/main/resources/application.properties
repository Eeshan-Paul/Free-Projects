spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# to stop database sensitive information from getting printed in console
logging.level.org.hibernate.orm.connections.pooling=WARN

# below is to specify to our maven project what type of db are we going to connect though in modern hibernate it automaically configures the db type
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#it is a configuration property that controls how Hibernate manages your database tables automatically based on your Java @Entity classes on startup.DDL
# none - Does absolutely nothing. Hibernate expects your tables to already exist exactly as your Java entities describe them.Production (Safe)
# validate - Checks your database tables against your Java entities. If they don't match, your application will crash with an error. It makes no changes to the database.Production / QA
# update - Most popular for development. It safely modifies your existing database structure. If you add a new field to your Java class, Hibernate adds that column to your table. It will never delete existing columns or data.Local Development
# create - Every time your application starts up, Hibernate drops all existing tables and creates brand new, empty ones. All data is lost on every restart.Integration Testing
# create-drop -> Same as create, but it also drops the tables when the application cleanly shuts down. It leaves your database completely empty.Unit Testing 
spring.jpa.hibernate.ddl-auto=update