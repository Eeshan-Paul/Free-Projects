<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Todo App</h1>

        <div class="controls">
            <input id="searchInput" type="text" placeholder="Search by title or description...">
            <button id="searchBtn">Search</button>
            <button id="loadAllBtn" class="secondary">Load All</button>
        </div>

        <form id="taskForm" class="task-form">
            <input type="hidden" id="taskId">
            <input id="title" type="text" placeholder="Task title" required>
            <textarea id="description" placeholder="Task description" rows="3" required></textarea>
            <div class="form-actions">
                <button type="submit">Save Task</button>
                <button type="button" id="cancelEdit" class="secondary hidden">Cancel</button>
            </div>
        </form>

        <div id="messageBox" class="message hidden"></div>

        <div class="task-list-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
